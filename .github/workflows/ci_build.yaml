name: CI build
on:
  push:
    branches:
      - main
      - ext/**
  pull_request:
    branches:
      - main
      - ext/**
  workflow_dispatch:
      
jobs:
  wf:
    name: Completeness of _CoqProject
    runs-on: ubuntu-latest
    steps:
      - name: repo checkout
        uses: actions/checkout@v4
      - name: check
        run: |
          .github/scripts/check_projects.sh theories

  build:
    name: Continuous Intergration
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: read
      contents: write
    env:
      REGISTRY: "ghcr.io"
      # The CI image lives in whichever repository is running the workflow, so a
      # fork uses its own package instead of one it has no read access to.  The
      # tag is published by docker.yaml; keep the two in sync.
      IMAGE_TAG: "rocq-9.2"
      # Only deploy if the build follows from pushing to one of main branches
      DOC_DEPLOY: ${{ (github.ref_name == 'main' || startsWith(github.ref_name, 'ext/')) && 'true' || 'false' }}
      DOC_DEPLOY_DEST: ${{ (startsWith(github.ref_name, 'ext/') && github.ref_name) || '' }}
    steps:
      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The homepage lists the ext/* branches, which needs them all.
          fetch-depth: 0
          
      - name: Log in container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the CI image
        id: image
        # GHCR paths are lowercase, repository names are not necessarily.
        run: echo "ref=${REGISTRY}/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Pre-pull docker image
        # Fall back to building it, so that the first run on a fresh fork — and
        # any run that races the docker.yaml rebuild of a changed Dockerfile —
        # still goes green instead of failing on a missing package.
        run: |
          docker pull "${{ steps.image.outputs.ref }}" \
            || docker build -f .github/Dockerfile -t "${{ steps.image.outputs.ref }}" .

      - name: Process main steps
        uses: coq-community/docker-coq-action@v1
        with:
          custom_image: ${{ steps.image.outputs.ref }}
          install: |
          before_script: |
            startGroup "Fix the permission issue"
              sudo chown -R "$(id -u):$(id -g)" .
            endGroup
          script: |
            startGroup "Build binary"
              make pretty-timed
            endGroup
            startGroup "Build HTMLs for GitHub pages"
              if [[ "${{ env.DOC_DEPLOY }}" == 'true' ]]; then
                make coqdoc
                make depgraphdoc
                mv theories/html html
                mv theories/dep.html html/dep.html
                cp assets/styling.css html/styling.css
                cp -r assets/images html/images
                # Only main's README is the homepage; an ext/* branch's docs go
                # to their own folder, and homepage.yaml refreshes the branch
                # list on the homepage after every build.
                if [[ "${{ github.ref_name }}" == 'main' ]]; then
                  git config --global --add safe.directory "$PWD"
                  .github/scripts/build_homepage.sh html
                fi
              fi
            endGroup
            startGroup "Run inline tests"
              dune runtest
            endGroup
          after_script: |
            startGroup "after"
            endGroup
          export: "OPAMJOBS OPAMYES"
        env:
          OPAMJOBS: ${{ steps.cpu-cores.outputs.count }}
          OPAMYES: "true"

      - name: Revert permissions
        # to avoid a warning at cleanup time
        if: ${{ always() }}
        run: sudo chown -R 1001:116 .

      - name: Deploy GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ env.DOC_DEPLOY == 'true' }}
        with:
          folder: html
          target-folder: ${{ env.DOC_DEPLOY_DEST }}
          clean-exclude: |
            ext
